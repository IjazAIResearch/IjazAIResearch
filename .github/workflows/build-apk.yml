name: Build PSL App APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fetch app binaries from project ZIP
        run: |
          curl -L -o $RUNNER_TEMP/psl.zip "https://muse.ai/files/1313644108504506/1405035981677208/ml8teivgl23iblndja7kxf63/PSL-App-Flutter.zip"
          mkdir -p $RUNNER_TEMP/psl && unzip -q $RUNNER_TEMP/psl.zip -d $RUNNER_TEMP/psl
          cp $RUNNER_TEMP/psl/assets/model.tflite sign-language-app/flutter_app/assets/model.tflite
          cp $RUNNER_TEMP/psl/android/gradle/wrapper/gradle-wrapper.jar sign-language-app/flutter_app/android/gradle-wrapper.jar
          for d in hdpi mdpi xhdpi xxhdpi xxxhdpi; do mkdir -p sign-language-app/flutter_app/android/app/src/main/res/mipmap-$d && cp $RUNNER_TEMP/psl/android/app/src/main/res/mipmap-$d/ic_launcher.png sign-language-app/flutter_app/android/app/src/main/res/mipmap-$d/ic_launcher.png; done
          rm -f sign-language-app/flutter_app/android/local.properties
          ls -la sign-language-app/flutter_app/assets/model.tflite sign-language-app/flutter_app/android/gradle-wrapper.jar

      - name: Install dependencies
        working-directory: sign-language-app/flutter_app
        run: flutter pub get

      - name: Build release APK
        working-directory: sign-language-app/flutter_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: psl-translator-apk
          path: sign-language-app/flutter_app/build/app/outputs/flutter-apk/app-release.apk
